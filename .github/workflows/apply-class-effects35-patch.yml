name: Apply class effects integration patch
on:
  push:
    branches: [codex/class-integration-engine]
    paths:
      - "scripts/apply_class_effects35_patch.mjs"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/class-integration-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply_class_effects35_patch.mjs
      - name: Commit generated integration patch
        run: |
          if git diff --quiet -- src/lib/classIntegration.js; then
            echo "No classIntegration change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/classIntegration.js
          git commit -m "feat: integrate structured class effects"
          git push origin HEAD:codex/class-integration-engine
