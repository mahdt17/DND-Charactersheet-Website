name: Reconcile four verified class tracker records
on:
  push:
    branches: [codex/class-integration-engine]
    paths:
      - scripts/reconcile_verified_class_tracker.mjs
      - .github/workflows/reconcile-verified-class-tracker.yml
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'mahdt17/DND-Charactersheet-Website' && github.ref == 'refs/heads/codex/class-integration-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm historical baseline and regression coverage
        run: |
          git merge-base --is-ancestor dc748a6ae8557ecd357dccab661757d951a3d932 HEAD
          node tests/class-actions-resources35.mjs
          node tests/class-actions-resources35-martial.mjs
      - name: Apply exact four-record patch and validate tracker
        run: |
          node scripts/reconcile_verified_class_tracker.mjs
          node scripts/classify_class_implementation_cohorts.mjs docs/class-completion-tracker.json --check
          node tests/class-implementation-cohorts35.mjs
      - name: Commit only the tracker on the existing development branch
        run: |
          if git diff --quiet -- docs/class-completion-tracker.json; then exit 0; fi
          test "$(git diff --name-only)" = "docs/class-completion-tracker.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/class-completion-tracker.json
          git commit -m "docs: reconcile four exact verified class tracker records"
          git push origin HEAD:refs/heads/codex/class-integration-engine
