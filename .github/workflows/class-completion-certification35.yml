name: Class completion certification
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/class-completion-evidence35.json"
      - "docs/class-completion-tracker.json"
      - "scripts/class_completion_certification35.mjs"
      - "scripts/validate_class_completion_queue35.mjs"
      - "scripts/class_review_coverage35.mjs"
      - "scripts/audit_prerequisite_coverage35.mjs"
      - "scripts/audit_casting_prerequisites35.mjs"
      - "src/lib/castingPrerequisites35.js"
      - "src/lib/classIntegration.js"
      - "src/data/class-feature-summaries-35.json"
      - "tests/casting-prerequisites35.mjs"
      - "src/lib/prerequisites35.js"
      - "scripts/build_class_completion_ledger.mjs"
      - "scripts/build_class_review_queue.mjs"
      - "scripts/select_class_research_batch.mjs"
      - "tests/class-completion-certification35.mjs"
      - "tests/class-review-coverage35.mjs"
      - "tests/source-choice-ui-context35.mjs"
      - "src/LevelUp.jsx"
      - "src/GuidedSetup.jsx"
      - "package.json"
      - ".github/workflows/class-completion-certification35.yml"
permissions:
  contents: read
concurrency:
  group: class-completion-certification35-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/class-completion-certification35.mjs
      - run: node tests/class-review-coverage35.mjs
      - run: node tests/casting-prerequisites35.mjs
      - run: node tests/source-choice-ui-context35.mjs
      - run: mkdir -p test-results
      - run: node scripts/audit_prerequisite_coverage35.mjs test-results/prerequisite-coverage35.json
      - run: node scripts/audit_casting_prerequisites35.mjs test-results/casting-prerequisite-coverage35.json
      - run: node scripts/build_class_completion_ledger.mjs --output=test-results/class-completion-ledger35.json
      - run: node scripts/build_class_review_queue.mjs docs/class-completion-tracker.json --output=test-results/class-review-queue35.json
      - run: node scripts/select_class_research_batch.mjs docs/class-completion-tracker.json --limit=5 > test-results/class-research-batch35.json
      - name: Verify fail-closed queue behavior
        run: node scripts/validate_class_completion_queue35.mjs docs/class-completion-tracker.json test-results/class-completion-ledger35.json test-results/class-review-queue35.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-completion-certification35
          path: test-results/
