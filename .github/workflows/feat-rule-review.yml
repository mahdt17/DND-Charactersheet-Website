name: Feat long-rule review

on:
  push:
    branches: [codex/content-foundation]
    paths:
      - ".github/feat-rule-review.request"

permissions:
  contents: read

concurrency:
  group: feat-long-rule-review
  cancel-in-progress: true

jobs:
  review-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Export long feat rules shard ${{ matrix.shard }}
        run: >
          python scripts/export_feat_rule_review.py
          --shard-count 8 --shard-index ${{ matrix.shard }} --delay 0.08
          --output test-results/review/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feat-rule-review-shard-${{ matrix.shard }}
          path: test-results/review/shard-${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: review-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: feat-rule-review-shard-*
          path: test-results/review-shards
          merge-multiple: true
      - name: Merge review queue
        run: >
          python scripts/merge_feat_rule_review.py
          --input-dir test-results/review-shards
          --shard-count 8
          --output test-results/feat-rule-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feat-rule-review
          path: test-results/feat-rule-review.json
          retention-days: 1
