name: Validate modernization
on:
  push:
    branches: [codex/modernize-editions-wizard]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: modernization-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/casting.mjs
      - run: node tests/editions.mjs
      - run: npm run test:content
      - run: python scripts/enrich_dndtools.py --self-test
      - run: python scripts/preflight_35_class_regressions.py
      - run: python scripts/import_wikidot.py --self-test
      - run: python tests/enrichment_gate.py
      - run: node tests/setup-choices.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/browser-editions.mjs
      - run: node tests/browser-casting-setup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modernization-browser-results
          path: test-results/

  enrichment-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sample:
          - { label: classes-25, dnd: 25 }
          - { label: classes-50, dnd: 50 }
          - { label: classes-100, dnd: 100 }
    steps:
      - uses: actions/checkout@v4
      - run: python --version
      - name: Strict 3.5 class preflight (${{ matrix.sample.label }})
        run: python scripts/preflight_enrichment.py --dnd-sample ${{ matrix.sample.dnd }} --min-rate 1.0 --delay 0.10 --only 3.5/classes --report test-results/enrichment-${{ matrix.sample.label }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrichment-${{ matrix.sample.label }}-report
          path: test-results/enrichment-${{ matrix.sample.label }}.json
