name: Validate modernization
on:
  push:
    branches: [codex/modernize-editions-wizard]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: modernization-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/casting.mjs
      - run: node tests/editions.mjs
      - run: npm run test:content
      - run: python scripts/enrich_dndtools.py --self-test
      - run: python scripts/preflight_35_class_regressions.py
      - run: python scripts/preflight_35_feat_regressions.py
      - run: python scripts/preflight_35_spell_regressions.py
      - run: python scripts/preflight_35_item_regressions.py
      - run: python scripts/import_wikidot.py --self-test
      - run: python scripts/preflight_5e_item_regressions.py
      - run: python scripts/audit_srd2024.py
      - run: python tests/enrichment_gate.py
      - run: node tests/setup-choices.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/browser-editions.mjs
      - run: node tests/browser-casting-setup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modernization-browser-results
          path: test-results/

