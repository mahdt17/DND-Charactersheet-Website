name: Validate modernization
on:
  push:
    branches: [codex/modernize-editions-wizard]
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/wikidot-repair*.request"
permissions:
  contents: read
concurrency:
  group: modernization-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: scope
        name: Choose targeted or full validation
        env:
          BEFORE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/determine_spell_validation_scope.py \
            --before "$BEFORE_SHA" --after "$AFTER_SHA" \
            --milestone-size 50 \
            --report test-results/spell-validation-scope.json \
            --ids-file test-results/changed-spell-regressions.txt
      - run: npm test
      - run: node tests/casting.mjs
      - run: node tests/editions.mjs
      - run: npm run test:content
      - run: python scripts/enrich_dndtools.py --self-test
      - run: python scripts/classify_spell_review_queue.py --self-test
      - run: python scripts/select_spell_review_batch.py --self-test
      - run: python scripts/select_spell_reference_batch.py --self-test
      - run: python scripts/select_spell_prerequisite_wave.py --self-test
      - run: python scripts/select_spell_exact_duplicate_batch.py --self-test
      - run: python scripts/select_spell_near_duplicate_batch.py --self-test
      - run: python scripts/select_spell_repair_candidate_manifest.py --self-test
      - run: python scripts/import_wikidot.py --self-test
      - run: python scripts/audit_srd2024.py
      - run: python tests/enrichment_gate.py
      - run: node tests/setup-choices.mjs
      - run: node tests/integration-foundation.mjs
      - run: node tests/class-integration.mjs
      - run: python tests/class-feature-review.py
      - run: node tests/class-catalog-lifecycle.mjs
      - run: python scripts/audit_source_identity_and_descriptions.py
      - run: node scripts/audit_class_automation.mjs
      - name: Validate research pipeline helpers
        run: |
          node --check scripts/validate_extraction.mjs
          node --check scripts/select_class_research_batch.mjs
          node --check scripts/generate_progress_report.mjs
          node scripts/select_class_research_batch.mjs docs/class-completion-tracker.json --limit=5 > test-results/class-research-batch.json
          node scripts/generate_progress_report.mjs docs/class-completion-tracker.json --output=test-results/project-progress.json
          node --check scripts/build_class_review_queue.mjs
          node scripts/build_class_review_queue.mjs docs/class-completion-tracker.json --output=test-results/class-review-queue.json
          node -e "const q=require('./test-results/class-review-queue.json');if(!q.queue.some(x=>x.recordId==='classes/binder-112'&&x.reasons.includes('binding-subsystem-requires-structured-model')))process.exit(1)"
      - run: node tests/multiclass-casting.mjs
      - run: node tests/spell-access.mjs
      - run: node tests/subclass-feat-magic.mjs
      - run: node tests/feat-gaps.mjs
      - run: node tests/legacy-casting-choices.mjs
      - run: node tests/legacy-special-casting.mjs
      - run: node tests/legacy-preparation.mjs
      - run: node tests/hit-dice.mjs
      - run: node tests/multiclass-training.mjs
      - run: node tests/resources.mjs
      - run: node tests/feature-choices.mjs
      - run: node tests/feat-selection.mjs
      - run: node tests/presentation.mjs
      - run: node tests/dice-physics.mjs
      - name: Run targeted live spell regressions
        if: steps.scope.outputs.mode == 'targeted' && steps.scope.outputs.added_count != '0'
        run: >-
          python scripts/preflight_35_spell_regressions.py
          --ids-file test-results/changed-spell-regressions.txt
      - name: Run full 3.5 class regressions
        if: steps.scope.outputs.mode == 'full'
        run: python scripts/preflight_35_class_regressions.py
      - name: Run full 3.5 feat regressions
        if: steps.scope.outputs.mode == 'full'
        run: python scripts/preflight_35_feat_regressions.py
      - name: Run full 3.5 spell regressions
        if: steps.scope.outputs.mode == 'full'
        run: python scripts/preflight_35_spell_regressions.py
      - name: Run full 3.5 item regressions
        if: steps.scope.outputs.mode == 'full'
        run: python scripts/preflight_35_item_regressions.py
      - name: Run full 5e item regressions
        if: steps.scope.outputs.mode == 'full'
        run: python scripts/preflight_5e_item_regressions.py
      - name: Build application
        if: steps.scope.outputs.mode == 'full'
        run: npm run build
      - name: Install Chromium
        if: steps.scope.outputs.mode == 'full'
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        if: steps.scope.outputs.mode == 'full'
        run: npm run test:browser
      - name: Run edition browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-editions.mjs
      - name: Run casting/setup browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-casting-setup.mjs
      - name: Run catalog and advancement browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-integration.mjs
      - name: Run class spell access browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-spell-access.mjs
      - name: Run subclass and feat magic browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-subclass-feat-magic.mjs
      - name: Run domain, power, invocation and ritual browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-casting-gaps.mjs
      - name: Run class resource tracker browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-resources.mjs
      - name: Run guided feature choice browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-feature-choices.mjs
      - name: Run level-up feat browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-feat-selection.mjs
      - name: Run fantasy presentation and dice browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-presentation.mjs
      - name: Run production loading browser tests
        if: steps.scope.outputs.mode == 'full'
        run: node tests/browser-loading.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modernization-validation-results
          path: |
            test-results/spell-validation-scope.json
            test-results/changed-spell-regressions.txt
            test-results/
