name: Validate modernization
on:
  push:
    branches: [codex/modernize-editions-wizard]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: modernization-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/casting.mjs
      - run: node tests/editions.mjs
      - run: npm run test:content
      - run: python scripts/enrich_dndtools.py --self-test
      - run: python scripts/preflight_35_class_regressions.py
      - run: python scripts/preflight_35_feat_regressions.py
      - run: python scripts/import_wikidot.py --self-test
      - run: python tests/enrichment_gate.py
      - run: node tests/setup-choices.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/browser-editions.mjs
      - run: node tests/browser-casting-setup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modernization-browser-results
          path: test-results/

  feat-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python --version
      - name: Strict 250-record 3.5 feat preflight
        run: python scripts/preflight_enrichment.py --dnd-sample 250 --min-rate 1.0 --delay 0.12 --only 3.5/feats --report test-results/enrichment-feats-250.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrichment-feats-250-report
          path: test-results/enrichment-feats-250.json

  enrichment-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python --version
      - name: Strict full 3.5 class preflight
        run: python scripts/preflight_enrichment.py --full --min-rate 1.0 --delay 0.12 --only 3.5/classes --report test-results/enrichment-classes-full.json
      - name: Build complete 3.5 class dry-run candidate
        run: python scripts/enrich_dndtools.py --categories classes --force --delay 0.12 --candidate-dir test-results/candidates
      - name: Audit complete 3.5 class candidate output
        run: python scripts/audit_enrichment_output.py test-results/candidates --source-audit test-results/enrichment-classes-full.json --only 3.5/classes --output test-results/enrichment-classes-output-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrichment-classes-full-report
          path: |
            test-results/enrichment-classes-full.json
            test-results/enrichment-classes-output-audit.json
            test-results/candidates/dndtools/classes.json
