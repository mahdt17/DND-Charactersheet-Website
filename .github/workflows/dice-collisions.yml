name: Dice collision results
on:
  pull_request:
    paths:
      - 'src/lib/dice*.js'
      - 'src/lib/presentation.js'
      - 'src/DiceAnimation.jsx'
      - 'src/DiceTray.jsx'
      - 'src/ModernLedger.jsx'
      - 'tests/browser-dice-reveal.mjs'
      - 'tests/dice-landings.mjs'
      - 'tests/helpers/dice-collisions.mjs'
      - '.github/workflows/dice-collisions.yml'
permissions:
  contents: read
jobs:
  dice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/dice-physics.mjs && node tests/dice-landings.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify printed faces after collisions in WebGL
        run: |
          node --input-type=module <<'NODE'
          import {createServer} from 'vite';
          import {chromium} from 'playwright';
          import {verifySharedDiceCollisions} from './tests/helpers/dice-collisions.mjs';
          const server=await createServer({server:{host:'127.0.0.1',port:5189,strictPort:true}});
          await server.listen();
          const browser=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try{await verifySharedDiceCollisions(browser,'http://127.0.0.1:5189/',server.config.base);}
          finally{await browser.close();await server.close();}
          NODE
      - name: Check result timing and advantage in the production bundle
        env:
          DICE_TEST_URL: http://127.0.0.1:4173/DND-Charactersheet-Website/
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          curl --fail --silent --retry 12 --retry-connrefused "$DICE_TEST_URL" >/dev/null
          node tests/browser-dice-reveal.mjs

  rolling-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            tests: tests/browser-ability-score-breakdown.mjs tests/browser-campaign-play-actions.mjs tests/browser-druid-companion-sheet.mjs tests/browser-lorehold-benefits-sheet.mjs tests/browser-subclass-active.mjs tests/browser-continuous-dice.mjs
          - group: 2
            tests: tests/browser-accursed-specter-sheet.mjs tests/browser-companion-traits.mjs tests/browser-echo-sheet.mjs tests/browser-lorehold-healing-spell.mjs tests/browser-thrall-combat.mjs tests/browser-lupin.mjs
          - group: 3
            tests: tests/browser-alchemist-elixir-final.mjs tests/browser-dancing-item-sheet.mjs tests/browser-editions.mjs tests/browser-martial-subclasses.mjs tests/browser-vigilant-blessing.mjs tests/browser-ability-rolls.mjs
          - group: 4
            tests: tests/browser-artillerist-two-cannons-sheet.mjs tests/browser-divine-strike.mjs tests/browser-fighting-styles.mjs tests/browser-sentinel-raven-sheet.mjs tests/browser-wildfire-enhanced-bond.mjs
          - group: 5
            tests: tests/browser-battle-master-priority.mjs tests/browser-drakewarden-sheet.mjs tests/browser-fungal-zombie-sheet.mjs tests/browser-shadow-hound-sheet.mjs tests/browser.mjs
          - group: 6
            tests: tests/browser-beast-master-sheet.mjs tests/browser-drakewarden-ua-sheet.mjs tests/browser-leonin.mjs tests/browser-steel-defender-sheet.mjs tests/browser-presentation.mjs
    name: Roll history group ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise all selected roll controls
        env:
          SUITES: ${{ matrix.tests }}
        run: |
          mkdir -p test-results
          result=0
          for suite in $SUITES; do
            echo "::group::$suite"
            if ! node "$suite"; then
              echo "::error::$suite failed"
              result=1
            fi
            echo "::endgroup::"
          done
          exit "$result"
