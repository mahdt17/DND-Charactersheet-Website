name: 3.5 healing and smite resources
on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/classIntegration.js"
      - "src/lib/resources.js"
      - "src/lib/featMagic.js"
      - "src/lib/smiteResources35.js"
      - "src/data/class-feature-summaries-35.json"
      - "src/data/class-reviewed-features-35-wave2.json"
      - "src/ResourceTracker.jsx"
      - "src/RestDialog.jsx"
      - "public/catalogs/dndtools/classes.json"
      - "tests/healing-resources35.mjs"
      - "tests/browser-healing-resources35.mjs"
      - "tests/smite-resources35.mjs"
      - "tests/browser-smite-resources35.mjs"
      - "tests/class-wave35-metadata.mjs"
      - "tests/class-six-batch-finalization35.mjs"
      - "tests/resources.mjs"
      - "tests/browser-resources.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/healing-resources35.yml"
permissions:
  contents: read
concurrency:
  group: healing-resources35-${{ github.ref }}
  cancel-in-progress: true
jobs:
  healing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/healing-resources35.mjs
      - run: node tests/smite-resources35.mjs
      - run: node tests/class-wave35-metadata.mjs
      - run: node tests/class-six-batch-finalization35.mjs
      - run: node tests/resources.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: node tests/browser-healing-resources35.mjs
      - run: node tests/browser-smite-resources35.mjs
      - run: node tests/browser-resources.mjs
